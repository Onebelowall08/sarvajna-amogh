apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: sarvajna-cluster
servers: 1
agents: 0
volumes:
  - volume: /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux
    nodeFilters:
      - server:*
  - volume: /sys/kernel/debug:/sys/kernel/debug
    nodeFilters:
      - server:*
ports:
  - port: 3500:3000
    nodeFilters:
      - server:0
  - port: 8080:8080
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --disable-network-policy
        nodeFilters:
          - server:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
