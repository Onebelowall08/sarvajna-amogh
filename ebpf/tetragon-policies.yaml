apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sarvajna-file-open
spec:
  podSelector:
    matchLabels:
      app: target-app
  kprobes:
    - call: "security_file_open"
      syscall: false
      args:
        - index: 0
          type: "file"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/tmp/"
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sarvajna-tcp-connect
spec:
  podSelector:
    matchLabels:
      app: target-app
  kprobes:
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotDAddr"
              values:
                - 127.0.0.1
