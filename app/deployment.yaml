apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: default
  labels:
    app: target-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
        - name: nextjs
          image: target-app:v2
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: "3000"
            # Always true, and never changed per cell. Whether a revocation has
            # any effect is controlled at the response worker, which writes to
            # the store this application polls only in cells that enforce.
            #
            # Setting this per cell would patch the application deployment and
            # therefore replace the pod, and the pod's filesystem holds the 512
            # objects the workload reads. A cell that began by discarding them
            # would return 404 on every object read and record almost nothing
            # while appearing to have run.
            - name: ENFORCE_REVOCATION
              value: "true"
            - name: REVOCATION_POLL_MS
              value: "500"
            - name: PG_HOST
              value: "postgres.sarvajna-infra.svc.cluster.local"
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              value: "sarvajna"
            - name: PG_PASSWORD
              value: "amogh_secure_pwd"
            - name: PG_DB
              value: "sarvajna_db"
            # Distinct objects per authorisation failure; see reports route.
            - name: CONFIDENTIAL_FILE_COUNT
              value: "512"
            # Overwritten by the harness with the target-app ClusterIP, which
            # is the allowlisted preview destination for benign traffic.
            - name: PREVIEW_ALLOWED_ENDPOINTS
              value: "nats.sarvajna-infra.svc.cluster.local:4222"
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: target-app
  ports:
    - port: 3000
      targetPort: 3000
